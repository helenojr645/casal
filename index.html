<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0f1317">
<title>Divisão do Casal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1317; --surface: #171d23; --surface2: #1f272f; --line: #2b353f;
    --text: #e9eef2; --muted: #95a3b0; --faint: #6c7a87;
    --ma: #ee86aa; --heleno: #72a9f2; --casa: #e6b552;
    --cartao: #8494ab; --divida: #b893e6; --cobre: #f2905f; --livre: #5fc48f; --antigo: #5d6a76;
    --warn-bg: #2c2214; --warn-line: #6b4f1f;
    --display: "Bricolage Grotesque", "Figtree", -apple-system, system-ui, sans-serif;
    --body: "Figtree", -apple-system, system-ui, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: var(--body); font-size: 16px; line-height: 1.5; }
  .wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 48px; display: grid; gap: 28px; }
  h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
  h1 { font-size: clamp(28px, 7vw, 40px); font-weight: 800; letter-spacing: -0.01em; line-height: 1.1; }
  h2 { font-size: 20px; font-weight: 600; }
  p { margin: 0; }
  .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 600; }
  .num { font-variant-numeric: tabular-nums; }
  header { display: grid; gap: 10px; }
  .lead { color: var(--muted); max-width: 62ch; }
  .lead b { color: var(--text); font-weight: 600; }

  .steps { display: grid; gap: 8px; grid-template-columns: 1fr; padding: 0; margin: 0; list-style: none; }
  .steps li { display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .steps .n { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; background: var(--surface2); color: var(--ma); }
  .steps li:last-child .n { color: var(--divida); }
  @media (min-width: 760px) { .steps { grid-template-columns: repeat(2, 1fr); } }

  .months { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .months button { flex: 1 0 auto; min-height: 44px; min-width: 64px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font: 600 15px var(--body); cursor: pointer; padding-inline: 14px; }
  .months button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--heleno); outline-offset: 2px; }

  .alert { background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 12px; }
  .alert p b { color: var(--cobre); }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--bg); border-radius: 12px; padding: 4px; }
  .seg button { min-height: 44px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font: 600 14px var(--body); cursor: pointer; padding-inline: 8px; }
  .seg button[aria-pressed="true"] { background: var(--surface2); color: var(--text); }
  .okmsg { color: var(--livre); font-weight: 600; }

  .people { display: grid; gap: 16px; grid-template-columns: 1fr; }
  @media (min-width: 900px) { .people { grid-template-columns: repeat(3, 1fr); align-items: start; } }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 14px; }
  .card .who { display: flex; align-items: center; gap: 10px; }
  .card .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .card h3 { font-size: 20px; font-weight: 600; }
  .big { display: grid; gap: 2px; }
  .big .v { font-family: var(--display); font-size: 34px; font-weight: 800; line-height: 1.1; }
  .big .k { color: var(--muted); font-size: 14px; }
  .bar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--surface2); gap: 2px; }
  .bar span { display: block; height: 100%; min-width: 3px; }
  .rows { display: grid; gap: 0; margin: 0; }
  .rows div { display: flex; justify-content: space-between; gap: 12px; padding-block: 8px; border-top: 1px solid var(--line); font-size: 15px; }
  .rows dt { color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .rows dd { margin: 0; font-weight: 600; white-space: nowrap; }
  .rows .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .rows .total { border-top: 2px solid var(--line); }
  .rows .total dt { color: var(--text); font-weight: 700; }
  .rows .in dd { color: var(--livre); }
  .rows .note dt, .rows .note dd { color: var(--cobre); }
  .small { font-size: 13px; color: var(--faint); }

  .chartbox { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 10px; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 14px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  svg { width: 100%; max-width: 640px; height: auto; display: block; }
  .mgroup { cursor: pointer; }

  .agenda { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
  .agenda li { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); align-items: center; }
  .agenda li:first-child { border-top: 0; }
  .agenda .d { font-weight: 700; color: var(--muted); font-size: 14px; }
  .agenda .v { font-weight: 600; white-space: nowrap; }
  .agenda .s { font-size: 13px; color: var(--faint); }
  .premissas { color: var(--muted); display: grid; gap: 8px; padding-left: 20px; margin: 0; max-width: 70ch; }
  section { display: grid; gap: 12px; }
  @media (prefers-reduced-motion: no-preference) { .bar span { transition: flex-grow .25s ease; } }
</style>

<style>
  .lock { min-height: 80dvh; display: grid; place-items: center; padding-inline: 16px; }
  .lock form { width: 100%; max-width: 360px; display: grid; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 24px; }
  .lock h1 { font-size: 28px; }
  .lock label { font-weight: 600; font-size: 15px; }
  .lock input { width: 100%; min-height: 48px; font: 16px var(--body); color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding-inline: 14px; }
  .lock input:focus-visible { outline: 2px solid var(--heleno); outline-offset: 1px; }
  .lock button { min-height: 48px; border: 0; border-radius: 12px; background: var(--text); color: var(--bg); font: 700 16px var(--body); cursor: pointer; }
  .lock button[disabled] { opacity: .6; cursor: wait; }
  .lock .erro { color: var(--cobre); min-height: 1.5em; font-size: 15px; }
</style>
<div class="lock" id="lock">
  <form id="f" autocomplete="on">
    <span class="eyebrow">Heleno &amp; Ma</span>
    <h1>Divisão do Casal</h1>
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password" required>
    <button type="submit" id="abrir">Abrir</button>
    <p class="erro" id="erro" role="alert"></p>
  </form>
</div>
<div id="raiz"></div>


<script>
function iniciar(P) {
  'use strict';
  var cen = 'plano', D = P[cen];
  var NOME = { '2026-10': 'Outubro', '2026-11': 'Novembro', '2026-12': 'Dezembro', '2027-01': 'Janeiro', '2027-02': 'Fevereiro' };
  var CURTO = { '2026-10': 'Out', '2026-11': 'Nov', '2026-12': 'Dez', '2027-01': 'Jan', '2027-02': 'Fev' };
  var sel = 0;

  function brl(v) { return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
  function brl0(v) { return brl(v).replace(/,\d\d$/, ''); }
  function dia(s) { return s.slice(8, 10) + '/' + s.slice(5, 7); }
  function pct(v, total) { return Math.round(v / total * 100) + '%'; }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (ch) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]; }); }

  // botoes dos meses
  // cenario: a Ma repassa tudo x gasta por fora como em outubro
  var segc = document.getElementById('cenario');
  [['plano', 'Ma repassa tudo'], ['real', 'Como outubro: ' + brl0(P.porFora) + ' por fora']].forEach(function (o) {
    var b = document.createElement('button');
    b.type = 'button'; b.textContent = o[1]; b.setAttribute('data-c', o[0]);
    b.addEventListener('click', function () { cen = o[0]; D = P[cen]; render(); });
    segc.appendChild(b);
  });

  var nav = document.getElementById('months');
  D.forEach(function (d, i) {
    var b = document.createElement('button');
    b.type = 'button'; b.textContent = CURTO[d.mes]; b.setAttribute('aria-label', NOME[d.mes]);
    b.addEventListener('click', function () { sel = i; render(); });
    nav.appendChild(b);
  });

  function barra(partes, total) {
    return '<div class="bar" aria-hidden="true">' + partes.filter(function (p) { return p.v > 0.005; }).map(function (p) {
      return '<span style="flex-grow:' + (p.v / total) + ';background:var(--' + p.c + ')"></span>';
    }).join('') + '</div>';
  }
  function linha(label, v, cor, cls) {
    return '<div' + (cls ? ' class="' + cls + '"' : '') + '><dt>' + (cor ? '<i class="sw" style="background:var(--' + cor + ')"></i>' : '') + label + '</dt><dd class="num">' + v + '</dd></div>';
  }

  function render() {
    var d = D[sel], ma = d.ma, h = d.heleno, mesTxt = NOME[d.mes].toLowerCase();
    var semDivida = Math.round((d.parcela - ma.divida) * 100) / 100;
    Array.prototype.forEach.call(nav.children, function (b, i) { b.setAttribute('aria-pressed', i === sel ? 'true' : 'false'); });
    Array.prototype.forEach.call(segc.children, function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-c') === cen ? 'true' : 'false'); });

    // aviso: onde o dinheiro da Ma acaba na fila
    var al = document.getElementById('alert'), txt;
    al.hidden = false;
    if (h.empresta > 0) txt = '<p>Em ' + mesTxt + ' o dinheiro da Ma acaba no cartão dela: <b>faltam ' + brl(h.empresta) + '</b>. Você paga a fatura e ela passa a te dever esse valor.' + (d.falta > 0 ? ' As outras contas da casa (' + brl(d.falta) + ') você cobre, sem virar dívida.' : '') + '</p>';
    else if (d.falta > 0) txt = '<p>Em ' + mesTxt + ' o dinheiro da Ma acaba nas outras contas da casa: ela paga ' + brl(ma.outras) + ' e <b>faltam ' + brl(d.falta) + '</b>, que você cobre. A dívida não recebe nada neste mês.</p>';
    else if (semDivida > 0) txt = '<p>Em ' + mesTxt + ' a Ma paga a casa e o cartão, e sobram <b>' + brl(ma.divida) + '</b> para a dívida. Ficam ' + brl(semDivida) + ' para depois.</p>';
    else txt = '<p class="okmsg">Em ' + mesTxt + ' a Ma paga a casa, o cartão e a parcela inteira da dívida.</p>';
    if (!d.casa.aluguel) txt += '<p>' + NOME[d.mes] + ' é mês de transição: o boleto do apê é de só ' + brl(d.casa.boleto) + ', <b>ainda sem aluguel</b>. Por isso a parte de cada um na casa é pequena. O valor cheio começa no mês seguinte.</p>';
    if (h.fica < 0) txt += '<p><b>Seu mês fecha negativo em ' + brl(-h.fica) + '.</b></p>';
    if (d.atraso > 0 || d.devendo > 0) txt += '<p class="small">Até ' + mesTxt + ': parcelas da dívida atrasadas <b class="num">' + brl(d.atraso) + '</b>' + (d.devendo > 0 ? ' · emprestado para o cartão dela <b class="num">' + brl(d.devendo) + '</b>' : '') + '.</p>';
    al.innerHTML = txt;

    // Ma
    var maEntra = ma.salario + ma.pai;
    var maCard = '<article class="card" aria-label="Ma">' +
      '<div class="who"><span class="dot" style="background:var(--ma)"></span><h3>Ma</h3></div>' +
      '<div class="big"><span class="v num" style="color:' + (ma.fica > 0 ? 'var(--livre)' : 'var(--text)') + '">' + brl(ma.fica) + '</span><span class="k">fica livre em ' + mesTxt + '</span></div>' +
      barra([{ v: ma.porFora, c: 'antigo' }, { v: ma.aluguel + ma.outras, c: 'casa' }, { v: ma.cartao, c: 'cartao' }, { v: ma.divida, c: 'divida' }, { v: ma.fica, c: 'livre' }], maEntra) +
      '<dl class="rows">' +
      linha('Salário (dia ' + dia(ma.diaSal) + ')', '+ ' + brl(ma.salario), null, 'in') +
      linha('Ajuda do pai (dia 20)', '+ ' + brl(ma.pai), null, 'in') +
      (ma.porFora > 0 ? linha('Outros gastos (fora do cartão)', '− ' + brl(ma.porFora), 'antigo') : '') +
      linha(d.casa.aluguel ? '1. Boleto do apê (parte dela)' : '1. Boleto do apê (mês sem aluguel)', '− ' + brl(ma.aluguel), 'casa') +
      linha('2. Cartão dela (BTG)', '− ' + brl(ma.cartao), 'cartao') +
      (h.empresta > 0 ? linha('Fica devendo do cartão', brl(h.empresta), null, 'note') : '') +
      linha('3. Água, luz e internet', '− ' + brl(ma.outras), 'casa') +
      (d.falta > 0 ? linha('Você cobre das contas', brl(d.falta), null, 'note') : '') +
      linha('4. Dívida com você', '− ' + brl(ma.divida), 'divida') +
      linha('Fica livre', brl(ma.fica), 'livre', 'total') +
      '</dl>' +
      '</article>';

    // Heleno
    var hEntra = h.sal30 + h.sal15 + h.divida;
    var hCard = '<article class="card" aria-label="Você">' +
      '<div class="who"><span class="dot" style="background:var(--heleno)"></span><h3>Você</h3></div>' +
      '<div class="big"><span class="v num" style="color:var(--' + (h.fica < 0 ? 'cobre' : 'livre') + ')">' + brl(h.fica) + '</span><span class="k">fica livre em ' + NOME[d.mes].toLowerCase() + '</span></div>' +
      barra([{ v: h.cartoes, c: 'cartao' }, { v: h.aluguelAntigo, c: 'antigo' }, { v: h.casaParte, c: 'casa' }, { v: h.cobre + h.empresta, c: 'cobre' }, { v: h.fica, c: 'livre' }], hEntra) +
      '<dl class="rows">' +
      linha('Salário (dia 30 anterior)', '+ ' + brl(h.sal30), null, 'in') +
      linha('Salário (dia 15)', '+ ' + brl(h.sal15), null, 'in') +
      linha('Dívida que a Ma paga', '+ ' + brl(h.divida), null, 'in') +
      linha('Seus cartões', '− ' + brl(h.cartoes), 'cartao') +
      (h.aluguelAntigo ? linha('Último aluguel do apê antigo', '− ' + brl(h.aluguelAntigo), 'antigo') : '') +
      linha(d.casa.aluguel ? 'Sua parte da casa' : 'Sua parte da casa (mês sem aluguel)', '− ' + brl(h.casaParte), 'casa') +
      (h.cobre > 0 ? linha('Cobre contas da casa da Ma', '− ' + brl(h.cobre), 'cobre', 'note') : '') +
      (h.empresta > 0 ? linha('Empresta pro cartão dela', '− ' + brl(h.empresta), 'cobre', 'note') : '') +
      linha('Fica livre', brl(h.fica), 'livre', 'total') +
      '</dl>' +
      '<p class="small">Seus cartões: XP ' + brl(h.xp) + ' · Nubank ' + brl(h.nu) + ' · sua parte do BTG ' + brl(h.btgTit) + '.</p>' +
      '</article>';

    // Contas da casa: quem paga quanto
    var maCasa = Math.round((ma.aluguel + ma.outras) * 100) / 100;
    var pCard = '<article class="card" aria-label="Contas da casa">' +
      '<div class="who"><span class="dot" style="background:var(--casa)"></span><h3>Contas da casa</h3></div>' +
      '<div class="big"><span class="v num">' + brl(d.casaTotal) + '</span><span class="k">contas da casa no mês</span></div>' +
      barra([{ v: maCasa, c: 'ma' }, { v: h.casaParte, c: 'heleno' }, { v: h.cobre, c: 'cobre' }], d.casaTotal) +
      '<dl class="rows">' +
      linha('Boleto do apê (dia 25)', brl(d.casa.boleto)) +
      (d.casa.agualuz ? linha('Água e luz', brl(d.casa.agualuz)) : '') +
      (d.casa.internet ? linha('Internet', brl(d.casa.internet)) : '') +
      linha('Ma paga (' + pct(maCasa, d.casaTotal) + ')', brl(maCasa), 'ma', 'total') +
      linha('Você paga (' + pct(h.casaParte + h.cobre, d.casaTotal) + ')', brl(h.casaParte + h.cobre), 'heleno') +
      '</dl>' +
      '<p class="small">Pelo combinado seria ' + pct(d.parte.ma, d.casaTotal) + ' dela e ' + pct(d.parte.heleno, d.casaTotal) + ' seu. Isso pesa igual para os dois: ' + pct(d.parte.ma, maEntra) + ' da renda dela e ' + pct(d.parte.heleno, h.sal30 + h.sal15) + ' da sua.</p>' +
      '<p class="small">' + (d.casa.aluguel ? 'O boleto junta o aluguel e as taxas do prédio. ' : 'O boleto deste mês ainda não tem aluguel. ') + 'Tudo sai da sua conta; a parte da Ma chega pelo Pix dela.</p>' +
      '</article>';

    document.getElementById('people').innerHTML = maCard + hCard + pCard;

    // agenda: a Ma repassa em dois Pix (dia do salario + dia 20, quando chega a ajuda do pai)
    var maTotal = Math.round((maCasa + ma.cartao + ma.divida) * 100) / 100;
    var pix2 = Math.min(ma.pai, maTotal), pix1 = Math.round((maTotal - pix2) * 100) / 100;
    var ag = [
      { d: h.btgData, t: 'Você paga a fatura do BTG inteira', v: '− ' + brl(h.btgTit + ma.cartaoCheio), s: 'a parte da Ma é ' + brl(ma.cartaoCheio) + (h.empresta > 0 ? '; ela só devolve ' + brl(ma.cartao) + ' agora' : ', que volta no Pix dela') },
      { d: ma.diaSal, t: 'Salário da Ma e 1º Pix dela pra você', v: brl(pix1), s: 'aluguel, cartão dela, contas e dívida' },
      { d: d.mes + '-15', t: 'Seu salário', v: '+ ' + brl(h.sal15), s: 'dia 15' },
      { d: d.mes + '-20', t: '2º Pix da Ma pra você', v: brl(pix2), s: 'a ajuda do pai, que chega neste dia' },
      { d: d.mes + '-20', t: 'Você paga água, luz e internet', v: '− ' + brl(d.casa.agualuz + d.casa.internet), s: 'data aproximada; depende do vencimento de cada conta' },
      { d: d.mes + '-25', t: 'Você paga o boleto do apê', v: '− ' + brl(d.casa.boleto), s: d.casa.aluguel ? 'aluguel e taxas do prédio' : 'ainda sem aluguel' }
    ].filter(function (x) { return x.v !== '− ' + brl(0); }).sort(function (a, b) { return a.d < b.d ? -1 : a.d > b.d ? 1 : 0; });
    document.getElementById('agenda').innerHTML = ag.map(function (x) {
      return '<li><span class="d num">' + dia(x.d) + '</span><span><span>' + esc(x.t) + '</span><br><span class="s">' + esc(x.s) + '</span></span><span class="v num">' + x.v + '</span></li>';
    }).join('');

    desenhaGrafico();
  }

  function desenhaGrafico() {
    var svg = document.getElementById('chart'), ns = 'http://www.w3.org/2000/svg';
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    function el(t, a, txt) { var e = document.createElementNS(ns, t); for (var k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; }
    var W = 400, H = 250, L = 8, R = 8, T = 30, B = 34, ph = H - T - B;
    var max = 0; P.plano.concat(P.real).forEach(function (d) { max = Math.max(max, d.heleno.fica, d.ma.fica); });
    var yMax = Math.ceil(max / 1000) * 1000;
    function Y(v) { return T + ph - (Math.max(0, v) / yMax) * ph; }
    [0, yMax / 2, yMax].forEach(function (v) {
      svg.appendChild(el('line', { x1: L, x2: W - R, y1: Y(v), y2: Y(v), stroke: 'var(--line)', 'stroke-width': 1 }));
    });
    var slot = (W - L - R) / D.length, bw = Math.min(28, slot * 0.3);
    D.forEach(function (d, i) {
      var cx = L + slot * (i + 0.5), g = el('g', { 'class': 'mgroup', tabindex: 0, role: 'button', 'aria-label': NOME[d.mes] + ': Ma ' + brl0(d.ma.fica) + ', você ' + brl0(d.heleno.fica) });
      if (i === sel) g.appendChild(el('rect', { x: L + slot * i + 4, y: 4, width: slot - 8, height: H - 8, rx: 10, fill: 'var(--surface2)' }));
      [{ v: d.ma.fica, c: 'var(--ma)', x: cx - bw - 3 }, { v: d.heleno.fica, c: 'var(--heleno)', x: cx + 3 }].forEach(function (b) {
        var y = Y(b.v), h = Math.max(2, Y(0) - y);

(function () {
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  var f = document.getElementById('f'), btn = document.getElementById('abrir'), erro = document.getElementById('erro');
  f.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var senha = document.getElementById('senha').value;
    if (!window.crypto || !crypto.subtle) { erro.textContent = 'Este navegador não consegue abrir a página. Use o Safari ou o Chrome.'; return; }
    btn.disabled = true; btn.textContent = 'Abrindo…'; erro.textContent = '';
    crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey'])
      .then(function (k) {
        return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(PACOTE.salt), iterations: PACOTE.it, hash: 'SHA-256' },
          k, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      })
      .then(function (chave) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(PACOTE.iv) }, chave, b64(PACOTE.ct)); })
      .then(function (buf) {
        var p = JSON.parse(new TextDecoder().decode(buf));
        document.getElementById('lock').remove();
        document.getElementById('raiz').innerHTML = p.html;
        iniciar(p.dados);
      })
      .catch(function () {
        btn.disabled = false; btn.textContent = 'Abrir';
        erro.textContent = 'Senha errada. Confira maiúsculas e tente de novo.';
      });
  });
})();
