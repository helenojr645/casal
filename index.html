<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1317">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Casal">
<title>Casal</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1317; --surface: #171d23; --surface2: #1f272f; --line: #2b353f;
    --text: #e9eef2; --muted: #95a3b0; --faint: #6c7a87;
    --ma: #ee86aa; --heleno: #72a9f2; --casa: #e6b552;
    --in: #5fc48f; --out: #f07a6a; --warn: #f2905f; --est: #b893e6;
    --display: "Bricolage Grotesque", "Figtree", -apple-system, system-ui, sans-serif;
    --body: "Figtree", -apple-system, system-ui, "Segoe UI", sans-serif;
    --tabbar: 64px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); font-size: 16px; line-height: 1.45; }
  body { padding-bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 16px); }
  button { font: inherit; color: inherit; }
  h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
  h2 { font-size: 19px; font-weight: 600; }
  p { margin: 0; }
  .num { font-variant-numeric: tabular-nums; }
  .wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; display: grid; gap: 22px; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--heleno); outline-offset: 2px; }

  /* topo */
  .top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 8px; }
  .top-in { max-width: 760px; margin: 0 auto; display: grid; gap: 10px; }
  .top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { font-family: var(--display); font-weight: 800; font-size: 22px; display: flex; align-items: center; gap: 8px; }
  .brand i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .sync { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; min-height: 44px; background: none; border: 0; cursor: pointer; padding: 0; }
  .sync b { width: 8px; height: 8px; border-radius: 50%; background: var(--in); display: inline-block; }
  .sync.salvando b { background: var(--casa); animation: pisca 1s infinite; }
  .sync.erro b { background: var(--out); }
  @keyframes pisca { 50% { opacity: .3; } }
  .months { display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 2px; }
  .months::-webkit-scrollbar { display: none; }
  .months button { flex: none; min-height: 40px; min-width: 62px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-weight: 600; font-size: 15px; cursor: pointer; padding-inline: 12px; }
  .months button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .months button.atual::after { content: " •"; color: var(--in); }

  /* abas de baixo */
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px); display: flex; justify-content: center; }
  .tabs-in { display: grid; grid-template-columns: repeat(4, 1fr); width: 100%; max-width: 760px; }
  .tabs button { height: var(--tabbar); border: 0; background: none; color: var(--faint); font-size: 12px; font-weight: 600; display: grid; place-items: center; gap: 0; cursor: pointer; padding: 6px 0; }
  .tabs svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tabs button[aria-selected="true"] { color: var(--text); }

  /* blocos */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 12px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (min-width: 640px) { .tiles { grid-template-columns: repeat(4, 1fr); } }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 2px; }
  .tile .k { font-size: 13px; color: var(--muted); }
  .tile .v { font-family: var(--display); font-size: 22px; font-weight: 800; line-height: 1.2; }
  .tile .d { font-size: 12px; color: var(--faint); }
  .alerta { background: #2c2214; border: 1px solid #6b4f1f; border-radius: 14px; padding: 12px 14px; font-size: 15px; display: grid; gap: 4px; }
  .alerta b { color: var(--warn); }
  .small { font-size: 13px; color: var(--faint); }
  .sec { display: grid; gap: 10px; }
  .sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }

  /* grafico do mes */
  .chart svg { width: 100%; height: auto; display: block; }
  .chart .lg { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }

  /* cronograma */
  .dias { display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .dia { padding: 12px 14px; border-top: 1px solid var(--line); display: grid; gap: 8px; scroll-margin-top: 140px; }
  .dia:first-child { border-top: 0; }
  .dia.hoje { background: color-mix(in srgb, var(--surface2) 70%, transparent); }
  .dia.flash { animation: flash 1.2s ease; }
  @keyframes flash { 0% { background: #2a3440; } 100% { background: transparent; } }
  .dia-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .dia-h .data { font-weight: 700; }
  .dia-h .data small { color: var(--faint); font-weight: 500; margin-left: 6px; }
  .dia-h .saldo { font-weight: 700; font-size: 15px; }
  .item { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; width: 100%; text-align: left; background: none; border: 0; padding: 6px 0; cursor: pointer; min-height: 44px; }
  .item .nm { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .item .nm span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .vl { font-weight: 600; white-space: nowrap; }
  .item .st { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
  .item.info { cursor: default; opacity: .85; }
  .quem { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .chip { font-size: 11px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; border-radius: 6px; padding: 2px 6px; border: 1px solid var(--line); color: var(--muted); }
  .chip.pago { color: var(--in); border-color: color-mix(in srgb, var(--in) 45%, transparent); }
  .chip.pend { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, transparent); }
  .chip.est { color: var(--est); border-color: color-mix(in srgb, var(--est) 45%, transparent); }
  .chip.falt { color: var(--out); border-color: color-mix(in srgb, var(--out) 50%, transparent); }
  .pos { color: var(--in); } .neg { color: var(--out); }

  /* atualizar */
  .lista { display: grid; gap: 10px; }
  .linha { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 10px; }
  .linha-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .linha-h .t { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .linha-h .v { font-family: var(--display); font-weight: 800; font-size: 20px; white-space: nowrap; }
  .linha .sub { font-size: 13px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .acoes { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); color: var(--text); font-weight: 600; font-size: 15px; padding-inline: 14px; cursor: pointer; }
  .btn.pri { background: var(--text); color: var(--bg); border-color: var(--text); }
  .btn.ok { border-color: color-mix(in srgb, var(--in) 50%, transparent); color: var(--in); }
  .btn.del { color: var(--out); }
  .btn.cheio { width: 100%; }
  .btn:disabled { opacity: .5; }

  /* divisao */
  .pessoas { display: grid; gap: 12px; }
  @media (min-width: 700px) { .pessoas { grid-template-columns: 1fr 1fr; align-items: start; } }
  .rows { margin: 0; display: grid; }
  .rows div { display: flex; justify-content: space-between; gap: 10px; padding-block: 7px; border-top: 1px solid var(--line); font-size: 15px; }
  .rows dt { color: var(--muted); } .rows dd { margin: 0; font-weight: 600; white-space: nowrap; }
  .rows .tot { border-top: 2px solid var(--line); } .rows .tot dt { color: var(--text); font-weight: 700; }
  .rows .warn dt, .rows .warn dd { color: var(--warn); }
  .big { font-family: var(--display); font-size: 30px; font-weight: 800; line-height: 1.1; }
  .rows dt .quem, .duo .quem, .livre .lg .quem { display: inline-block; margin-right: 6px; }
  .bar { display: flex; gap: 2px; height: 10px; border-radius: 999px; overflow: hidden; background: var(--surface2); }
  .bar span { min-width: 3px; }
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .duo > div { display: grid; gap: 2px; min-width: 0; }
  .duo .k { font-size: 13px; color: var(--muted); }
  .duo .v { font-family: var(--display); font-size: 22px; font-weight: 800; line-height: 1.2; }
  .livre svg { width: 100%; height: auto; display: block; font-family: var(--body); }
  .livre rect[data-mes] { cursor: pointer; }
  .livre .lg { display: flex; gap: 16px; font-size: 13px; color: var(--muted); }
  .extrato { list-style: none; margin: 0; padding: 0; display: grid; }
  .extrato li { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 10px; padding-block: 9px; border-top: 1px solid var(--line); font-size: 15px; align-items: start; }
  .extrato .d { font-weight: 700; } .extrato .v { font-weight: 600; white-space: nowrap; }
  .extrato .s { display: block; font-size: 13px; color: var(--faint); }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
  .seg button { min-height: 44px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-weight: 600; font-size: 14px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--surface2); color: var(--text); }

  /* historico */
  .hist { display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
  .hist div { padding: 12px 14px; border-top: 1px solid var(--line); display: grid; gap: 2px; }
  .hist div:first-child { border-top: 0; }
  .hist small { color: var(--faint); }

  /* janela de baixo (bottom sheet) */
  .veu { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 50; display: grid; align-items: end; justify-items: center; }
  .sheet { width: 100%; max-width: 520px; background: var(--surface); border-radius: 20px 20px 0 0; border: 1px solid var(--line); border-bottom: 0;
    padding: 18px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; max-height: 90dvh; overflow-y: auto; }
  @media (min-width: 640px) { .veu { align-items: center; } .sheet { border-radius: 20px; border-bottom: 1px solid var(--line); } }
  .sheet h3 { font-size: 20px; }
  .campo { display: grid; gap: 6px; }
  .campo label { font-weight: 600; font-size: 14px; color: var(--muted); }
  .campo input, .campo select { width: 100%; min-height: 48px; font: 16px var(--body); color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding-inline: 14px; }
  .campo input.dinheiro { font-family: var(--display); font-size: 24px; font-weight: 800; }
  .campo .ajuda { font-size: 13px; color: var(--faint); }
  .sheet .erro { color: var(--out); font-size: 14px; min-height: 1em; }
  .sheet .botoes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opcoes { display: flex; gap: 8px; flex-wrap: wrap; }
  .opcoes button { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); padding-inline: 14px; cursor: pointer; font-weight: 600; }
  .opcoes button[aria-pressed="true"] { border-color: var(--text); background: var(--surface2); }

  /* aviso rapido */
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 12px); z-index: 60;
    background: var(--text); color: var(--bg); border-radius: 12px; padding: 10px 14px; font-weight: 600; font-size: 15px; display: flex; gap: 14px; align-items: center; max-width: calc(100% - 32px); box-shadow: 0 6px 24px rgba(0,0,0,.4); }
  .toast.ruim { background: var(--out); color: #1a0d0b; }
  .toast button { background: none; border: 0; font-weight: 800; text-decoration: underline; cursor: pointer; color: inherit; min-height: 32px; }

  /* entrada */
  .login { min-height: 100dvh; display: grid; place-items: center; padding: 16px; }
  .login-box { width: 100%; max-width: 360px; display: grid; gap: 18px; text-align: center; }
  .login h1 { font-size: 34px; font-weight: 800; }
  .quem-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .quem-btns button { min-height: 88px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); font-family: var(--display); font-size: 22px; font-weight: 800; cursor: pointer; display: grid; place-items: center; gap: 4px; }
  .quem-btns button i { width: 14px; height: 14px; border-radius: 50%; display: block; }
  .pin-dots { display: flex; justify-content: center; gap: 14px; min-height: 20px; }
  .pin-dots i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--muted); display: block; }
  .pin-dots i.on { background: var(--text); border-color: var(--text); }
  .teclado { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .teclado button { min-height: 60px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-size: 24px; font-weight: 600; cursor: pointer; }
  .teclado button:active { background: var(--surface2); }
  .login .erro { color: var(--out); min-height: 1.4em; }
  .login .voltar { background: none; border: 0; color: var(--muted); min-height: 44px; cursor: pointer; text-decoration: underline; }
  .carregando { display: grid; place-items: center; min-height: 60vh; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="login" class="login" hidden></div>

<div id="app" hidden>
  <header class="top">
    <div class="top-in">
      <div class="top-row">
        <div class="brand"><i id="eu-cor"></i><span id="titulo">Casal</span></div>
        <button class="sync" id="sync" type="button" aria-live="polite"><b></b><span>Salvo</span></button>
      </div>
      <nav class="months" id="months" aria-label="Escolher o mês"></nav>
    </div>
  </header>
  <main class="wrap" id="tela" style="padding-top:8px"></main>
  <nav class="tabs" role="tablist" aria-label="Seções">
    <div class="tabs-in">
      <button role="tab" data-aba="mes" aria-selected="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Mês</button>
      <button role="tab" data-aba="atualizar" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Atualizar</button>
      <button role="tab" data-aba="divisao" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="8" cy="12" r="5"/><circle cx="16" cy="12" r="5"/></svg>Divisão</button>
      <button role="tab" data-aba="historico" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>Histórico</button>
    </div>
  </nav>
</div>
<div id="veu-slot"></div>
<div id="toast-slot"></div>

<script src="config.js"></script>
<script src="motor.js"></script>
<script src="divisao.js"></script>
<script src="operacoes.js"></script>
<script src="app.js"></script>
</body>
</html>
